<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <rect width="200" height="300" fill="#111111"/>
  <!-- Film strip perforations top -->
  <rect x="12" y="12" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="36" y="12" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="60" y="12" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="84" y="12" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="108" y="12" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="132" y="12" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="156" y="12" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <!-- Film strip perforations bottom -->
  <rect x="12" y="278" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="36" y="278" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="60" y="278" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="84" y="278" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="108" y="278" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="132" y="278" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <rect x="156" y="278" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <!-- Central film reel icon -->
  <circle cx="100" cy="150" r="48" fill="none" stroke="#222222" stroke-width="2"/>
  <circle cx="100" cy="150" r="36" fill="#1a1a1a" stroke="#222222" stroke-width="1"/>
  <circle cx="100" cy="150" r="10" fill="#111111" stroke="#333333" stroke-width="1.5"/>
  <!-- Reel spokes -->
  <line x1="100" y1="114" x2="100" y2="140" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="160" x2="100" y2="186" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="69" y1="132" x2="91" y2="145" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="109" y1="155" x2="131" y2="168" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="131" y1="132" x2="109" y2="145" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="91" y1="155" x2="69" y2="168" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- No poster text -->
  <text x="100" y="230" text-anchor="middle" fill="#333333" font-family="system-ui,sans-serif" font-size="11" letter-spacing="2">NO POSTER</text>
</svg>
